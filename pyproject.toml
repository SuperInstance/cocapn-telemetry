[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cocapn-telemetry"
version = "0.1.0"
description = "Fleet metrics and monitoring. Pure Python, zero deps."
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/cocapn/cocapn-telemetry"

[tool.hatch.build.targets.wheel]
packages = ["src/cocapn_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
